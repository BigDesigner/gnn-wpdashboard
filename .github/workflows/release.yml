name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version override (e.g. 1.0.1). Leave empty to read from VERSION file.'
        required: false
        default: ''
      create_github_release:
        description: 'Create a GitHub Release & Tag?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-release:
    name: Build & Package Plugin Zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Resolve Version Number
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${{ github.event.inputs.version_override }}"
          else
            VERSION=$(cat gnn-wpdashboard/VERSION | tr -d '\r\n ')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version resolved: $VERSION"

      - name: Prepare Clean Plugin Package Directory
        run: |
          mkdir -p dist/gnn-wpdashboard
          cp -r gnn-wpdashboard/* dist/gnn-wpdashboard/

      - name: Create Zip Archive
        run: |
          cd dist
          zip -r "../gnn-wpdashboard-v${VERSION}.zip" gnn-wpdashboard
          cd ..
          ls -lh gnn-wpdashboard-v${VERSION}.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnn-wpdashboard-v${{ env.VERSION }}
          path: gnn-wpdashboard-v${{ env.VERSION }}.zip
          retention-days: 90

      - name: Create GitHub Release & Attach Zip
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## GNN WPDashboard v${{ env.VERSION }}
            - Complete WordPress plugin dashboard for installing and managing GitHub-hosted plugins.
            - Clean, production-ready plugin zip package attached.
          files: gnn-wpdashboard-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
